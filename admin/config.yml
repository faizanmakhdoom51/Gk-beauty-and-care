backend:
  name: git-gateway
  branch: main # Change to 'master' if your default GitHub branch is master

# Local media storage settings
media_folder: "public/images"
public_folder: "/images"

collections:
  - name: "shop"
    label: "Shop Management"
    files:
      - file: "products.json" # Change to "public/products.json" if your file is inside the public folder
        name: "products"
        label: "Product Catalog"
        format: "json"
        json_node: "" # Prevents Decap from wrapping items in custom Immutable maps
        fields:
          - label: "Products"
            name: "products"
            widget: "list"
            summary: "{{fields.name}} - {{fields.price}}{{fields.currency}}"
            field:
              label: "Product"
              name: "product"
              widget: "object"
              fields:
                - { label: "ID", name: "id", widget: "number", value_type: "int" }
                - { label: "Product Name", name: "name", widget: "string" }
                - { label: "Category", name: "category", widget: "select", options: ["Skincare", "Cosmetics", "Haircare", "Body Care"] }
                - { label: "Price", name: "price", widget: "number", value_type: "float" }
                - { label: "Currency", name: "currency", widget: "string", default: "$" }
                - { label: "Image URL", name: "image", widget: "string" }
                - { label: "In Stock", name: "inStock", widget: "boolean", default: true }
                - { label: "Description", name: "description", widget: "text" }
